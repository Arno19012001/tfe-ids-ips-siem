%YAML 1.1
---

# =============================================================
# Suricata — Configuration IPS inline NFQueue
# Contexte : TFE Eurostar — suricata-sensor (10.0.30.20)
# Mode     : inline NFQueue sur br0 (eth0 <-> eth1)
# Version  : Suricata 7.0.x
# =============================================================

# --- Mode NFQueue (IPS inline) ---
nfq:
  mode: accept          # comportement par défaut : laisser passer
  repeat-mark: 1        # évite la boucle infinie (paquet déjà traité)
  repeat-mask: 1
  route-queue: 2        # file de réinsertion après traitement
  fail-open: yes        # si Suricata plante -> fail-open (trafic passe)

# --- Statistiques globales (Suricata 7.x) ---
stats:
  enabled: yes
  interval: 30

# --- Outputs : EVE JSON (intégration Wazuh) + logs ---
outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: /var/log/suricata/eve.json
      types:
        - alert:
            payload: yes
            payload-buffer-size: 4kb
            payload-printable: yes
            packet: yes
            metadata: yes
            http-body: yes
            http-body-printable: yes
            tagged-packets: yes
        - http:
            extended: yes
        - dns:
            version: 2
        - tls:
            extended: yes
        - files:
            force-magic: no
        - smtp: {}
        - ssh: {}
        - flow: {}
        - netflow: {}

  # Logger de statistiques (performances Suricata)
  - stats:
      enabled: yes
      filename: /var/log/suricata/stats.log
      append: yes

# --- Règles de détection ---
default-rule-path: /etc/suricata/rules
rule-files:
  - base.rules
  - scenarios/scenario_A_nmap.rules
  - scenarios/scenario_B_hydra.rules
  - scenarios/scenario_C_sqlmap.rules

# --- Variables réseau ---
vars:
  address-groups:
    HOME_NET: "[10.0.0.0/8]"
    EXTERNAL_NET: "!$HOME_NET"
    DMZ_NET: "[10.0.10.0/24]"
    MGMT_NET: "[10.0.30.0/24]"
    LAN_NET: "[10.0.20.0/24]"

  port-groups:
    HTTP_PORTS: "80"
    SHELLCODE_PORTS: "!80"
    ORACLE_PORTS: 1521
    SSH_PORTS: 22
    FTP_PORTS: 21
    DNP3_PORTS: 20000
    MODBUS_PORTS: 502
    FILE_DATA_PORTS: "[$HTTP_PORTS,110,143]"
    FTP_DATA_PORTS: 20

# --- Performance ---
threading:
  set-cpu-affinity: no

# --- Logging interne Suricata ---
logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: yes
    - file:
        enabled: yes
        level: info
        filename: /var/log/suricata/suricata.log

# --- Répertoire de logs ---
default-log-dir: /var/log/suricata/

# --- Décodage protocolaire (App Layer) ---
app-layer:
  protocols:
    http:
      enabled: yes
    ftp:
      enabled: yes
    ssh:
      enabled: yes
    dns:
      enabled: yes
    tls:
      enabled: yes
      ja3-fingerprints: yes
